version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hte
      POSTGRES_PASSWORD: hte_secret
      POSTGRES_DB: hte_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hte -d hte_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hte_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hte.gov.in
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
